<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Flowti — Agent World</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap');

		* { margin: 0; padding: 0; box-sizing: border-box; }

		body {
			background: #070a12;
			overflow: hidden;
			font-family: 'Consolas', 'SF Mono', monospace;
		}

		canvas { display: block; }

		/* Subtle scanline overlay — CRT terminal feel */
		body::after {
			content: '';
			position: fixed;
			inset: 0;
			pointer-events: none;
			z-index: 9999;
			background: repeating-linear-gradient(
				0deg,
				transparent,
				transparent 2px,
				rgba(0, 0, 0, 0.03) 2px,
				rgba(0, 0, 0, 0.03) 4px
			);
			mix-blend-mode: multiply;
		}

		/* Warm vignette glow at edges */
		body::before {
			content: '';
			position: fixed;
			inset: 0;
			pointer-events: none;
			z-index: 9998;
			background: radial-gradient(
				ellipse at center,
				transparent 50%,
				rgba(7, 10, 18, 0.7) 100%
			);
		}
	</style>
</head>
<body>
	<script type="module" src="dashboard.js"></script>
</body>
</html>
